[tool.poetry]
name = "leagueoptimizer"
version = "0.1.0"
description = "League of Legends Optimizer - A tool for predicting game outcomes"
authors = ["Nacho Martinez <23caj23@gmail.com>"]
readme = "README.md"
packages = [{include = "leagueoptimizer"}]

[tool.poetry.dependencies]
python = "^3.8"
ujson = "^5.7.0"
numpy = "1.23"
pyyaml = "^6.0"
requests = "^2.31.0"
pandas = "^2.0.3"
autogluon = "^1.1.1"
oracledb = "^1.4.1"
pika = "^1.3.2"
python-dotenv = "^1.0.0"
flask = "^2.0.0"
flask-socketio = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.4.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.1.2"
sphinx-rtd-theme = "^1.3.0"
myst-parser = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.poetry.scripts]
leagueoptimizer = "leagueoptimizer.cli:main" 